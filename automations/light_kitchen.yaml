- alias: Kitchen_wled_on_by_motion
  mode: single
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.0xb40e060fffe10466_occupancy
      to:
        - "on"
  conditions:
    - condition: state
      entity_id: light.wled
      state:
        - "off"
    - condition: state
      entity_id: binary_sensor.day_tod
      state:
        - "off"
  actions:
    - action: select.select_option
      target:
        entity_id: select.wled_preset
      data:
        option: "White "
    - action: timer.start
      target:
        entity_id: timer.kitchen_wled_night_on_timer_1m
      data: {}
- alias: kitchen_wled_night_finished
  initial_state: true
  triggers:
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.kitchen_wled_night_on_timer_1m
  action:
    - action: light.turn_off
      data: {}
      target:
        entity_id: light.wled
    - action: timer.cancel
      target:
        entity_id: timer.kitchen_wled_night_on_timer_1m
      data: {}

- alias: kitchen_wled_nigh_timer_cancel_if_wled_off
  initial_state: true
  triggers:
    - trigger: state
      entity_id:
        - light.wled
      to:
        - "off"
  action:
    - action: timer.cancel
      target:
        entity_id: timer.kitchen_wled_night_on_timer_1m
      data: {}


# Start Home Assistant Notify
- id: notify-hass-start
  alias: Home Assistant Start - Notify
  initial_state: on
  trigger:
    platform: homeassistant
    event: start
  action:
    - service: notify.mobile_app_sm_s938w
      data:
        title: HA Started
        message: "{{'\U0001F525'}} Home Assistant Started {{ as_timestamp(states.sensor.date_time_iso.state) | timestamp_custom('%d-%m-%Y at %H:%M') }}"
        data:
          color: "#2DF56D"

- alias: shopinglist_updated
  initial_state: true
  trigger:
    - platform: event
      event_type: shopping_list_updated
      event_data:
        action: "add"
  action:
    - action: notify.mobile_app_sm_s938w
      data:
        title: '{{"\U0001F4B5"}} *Shopping list*'
        message: "'{{ trigger.event.data.item.name }}' has been added to the shopping list"
        data:
          actions:
            - action: URI
              title: "Open Shopping list "
              uri: /lovelace/shopping-list
          color: "#2DF56D"

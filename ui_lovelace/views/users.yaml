title: users
path: users
icon: mdi:account
type: panel
subview: true
cards:
  - type: custom:bootstrap-grid-card
    cards:
      - type: row
        cards:
          - type: custom:mushroom-template-card
            class: col-12 col-md-6 col-lg-3 px-2 pt-4
            entity: person.alex
            primary: "{{state_attr(config.entity, 'friendly_name') | capitalize }}"
            secondary: >-
              {{states(config.entity) | upper}} (Battery:
              {{states.sensor.sm_s938w_battery_level.state}}%
              {{states.sensor.sm_s938w_battery_state.state}})
            # icon: mdi:raspberry-pi
            picture: "{{- state_attr(config.entity, \"entity_picture\")  }}"
            features_position: bottom
            card_mod:
              style: |
                ha-card {
                  {% if states(config.entity) != 'home'  -%}
                    background: linear-gradient(90deg,
                    rgba(42, 123, 155, 0) 0%, 
                    rgba(135, 0, 0, 1) 100%);      /* Red */
                  {% else %}
                    background: linear-gradient(
                    90deg, 
                    rgba(0, 0, 0, 0) 0%, 
                    rgba(0, 135, 61, 1) 100%);
                  {% endif %}
                  animation: AnimationName 3s ease infinite;
                  background-size: 200% 500%;
                }
                @keyframes AnimationName {
                    0%{background-position:0% 50%}
                    50%{background-position:100% 50%}
                    100%{background-position:0% 50%}
                }
            tap_action: !include popup/device_tracker_aleks.yaml

          - type: custom:mushroom-template-card

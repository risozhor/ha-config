title: Doors & Windows
path: doors
icon: mdi:door-open
subview: true
type: panel
cards:
  - type: custom:bootstrap-grid-card
    cards:
      - type: row
        cards:
          - type: custom:mushroom-template-card
            class: col-12 col-md-6 col-lg-3 px-2 pt-4
            primary: "{{state_attr(config.entity, 'friendly_name') | capitalize }}"
            secondary: "{%- if is_state(config.entity, \"on\")-%}On{% else%}Off{%- endif -%}"
            icon: >-
              {%- if is_state(config.entity, "on")-%}hue:room-front-door{%
              else%}hue:room-front-door-off{%- endif -%}
            entity: binary_sensor.0xa4c138ac2143fba6_contact
            tap_action:
              action: none
            features_position: bottom
            color: |
              {%- if is_state(config.entity, "on")-%}green{% else%}blue{%- endif -%}
            card_mod:
              style: >
                  ha-tile-icon:before {
                    content: '';
                    position: absolute;
                    inset: 0;
                    border-radius: inherit;
                    pointer-events: none;
                    transform-origin: 50% 50%;
                    opacity:0.4;
                    {%- if is_state(config.entity, "on")-%}
                      animation: fan-warp 1.4s ease-in-out infinite; 
                    {% else %}
                      animation: none;
                    {% endif %}
                  }
                  ha-tile-icon {
                    padding:0!important;
                    margin: 0!important;
                    position: relative;
                    border-radius: 50%;
                  }
                  @keyframes fan-warp {
                    0% {box-shadow:0px 0px 0px 0px rgba(0, 255, 255, 0.7),0px 0px 0px 0px rgba(0, 255, 255, 0.25);}
                    100% {box-shadow:0 0 48px 48px rgba(0, 255, 255, 0),0 0 48px 48px rgba(0, 255, 255, 0);}
                  }
                  ha-card {clip-path: inset(0 0 0 0 round var(--ha-card-border-radius, 12px));}



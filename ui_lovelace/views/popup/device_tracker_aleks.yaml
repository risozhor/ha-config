action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: risozhor
    style: >
      --popup-max-width: 400px;
    content:
      type: vertical-stack
      cards:
        - type: entities
          card_mod:
            class: content
          entities:
            - entity: person.alex
              secondary_info: last-changed

        - type: custom:mushroom-chips-card
          card_mod:
            style: |
              .chip-container {
                  justify-content: center!important;
                }
          chips:
            - type: entity
              entity: sensor.sm_s938w_battery_level
              use_entity_picture: false
              content_info: state
              icon: mdi:cellphone-basic
              card_mod:
                style: |
                  ha-card {border-radius: 0!important; padding: 0;}
            - type: entity
              entity: sensor.galaxy_watch8_classic_battery_level
              icon: mdi:watch
              card_mod:
                style: |
                  ha-card {border-radius: 0!important; padding: 0;}
        - type: custom:mushroom-chips-card
          chips:
            - type: spacer
            - type: template
              icon: mdi:volume-high
              content: Find S25 Ultra
              tap_action:
                action: call-service
                service: notify.mobile_app_sm_s938w
                data:
                  message: TTS
                  data:
                    ttl: 0
                    priority: high
                    media_stream: alarm_stream
                    tts_text: Find me, i'm here!, i'm waiting for you!
            - type: spacer
        - type: custom:history-map-card
          entities:
            - entity: person.alex
              name: My Phone
              color: "#0288d1"
          hours_to_show: 24
          default_zoom: 14
          card_mod:
            style:
              .: |
                #root {
                  height: 25em;
                  padding-bottom: 0 !important;
                }
                ha-icon-button {
                  color: var(--primary-color);
                  zoom: 140%;
                  margin-left: -0.2em;
                }

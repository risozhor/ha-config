action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Yaroslava
    style: >
      --popup-max-width: 400px;
    content:
      type: vertical-stack
      cards:
        - type: entities
          card_mod:
            class: content
          entities:
            - entity: person.yaroslava
              secondary_info: last-changed
        - type: custom:mushroom-chips-card
          card_mod:
            style: |
              .chip-container {
                  justify-content: center!important;
                }
          chips:
            - type: entity
              entity: sensor.sm_m526b_battery_level
              use_entity_picture: false
              content_info: state
              icon: mdi:cellphone-basic
              card_mod:
                style: |
                  ha-card {border-radius: 0!important; padding: 0;}
        - type: custom:history-map-card
          entities:
            - entity: person.yaroslava
              name: My Phone
              color: "#40cf02"
          hours_to_show: 24
          default_zoom: 14
          card_mod:
            style:

              ha-map$: |
                #map {
                  background-color: #191919 !important;
                }
                .leaflet-control-attribution {
                  display: none;
                }
                .leaflet-bar a {
                  background-color: rgba(115, 123, 124, 0.2) !important;
                  color: #9da0a2 !important;
                  backdrop-filter: blur(0.25em);
                  zoom: 140%;
                }
                a.leaflet-control-zoom-in {
                  border-bottom: 1px solid #181818 !important;
                }
                .leaflet-pane.leaflet-tile-pane {
                  filter: invert(0.95) grayscale(0.95) contrast(95%);
                }

title: floorplan
path: floorplan
icon: mdi:floor-plan
subview: true
panel: true
cards:
  - type: custom:tabbed-card
    options: {}
    tabs:
      - card:
          type: picture-elements
          card_mod: null
          style: |
            ha-card {height: min-content!important;}
          image: /local/plan/all_off.png
          elements:
            - type: image
              style:
                top: 50%
                left: 50%
                width: 100%
              tap_action:
                action: none
              entity: light.kitchen_lights
              state_image:
                "on": /local/plan/kitchen_on.png
                "off": /local/plan/transparent.png
              hold_action:
                action: none
            - type: image
              style:
                top: 50%
                left: 50%
                width: 100%
              tap_action:
                action: none
              entity: light.living_room_lights
              state_image:
                "on": /local/plan/lr_on.png
                "off": /local/plan/transparent.png
              hold_action:
                action: none
            - type: image
              style:
                top: 50%
                left: 50%
                width: 100%
              tap_action:
                action: none
              entity: light.hallway_ceiling
              state_image:
                "on": /local/plan/hallway_on.png
                "off": /local/plan/transparent.png
              hold_action:
                action: none
            - type: image
              style:
                top: 50%
                left: 50%
                width: 100%
              tap_action:
                action: none
              entity: light.bathroom_lights
              state_image:
                "on": /local/plan/bath_on.png
                "off": /local/plan/transparent.png
              hold_action:
                action: none
            - type: image
              style:
                top: 50%
                left: 50%
                width: 100%
              tap_action:
                action: none
              entity: light.bedroom
              state_image:
                "on": /local/plan/bedroom_on.png
                "off": /local/plan/transparent.png
              hold_action:
                action: none
            - type: image
              style:
                top: 50%
                left: 50%
                width: 100%
              tap_action:
                action: none
              entity: light.kidsroom_ceil
              state_image:
                "on": /local/plan/kids_on.png
                "off": /local/plan/transparent.png
              hold_action:
                action: none
            - type: state-icon
              style:
                left: 36%
                top: 80%
              entity: light.kitchen_lights
              tap_action:
                action: toggle
            - type: state-icon
              style:
                left: 75%
                top: 80%
              tap_action:
                action: toggle
              entity: light.living_room_lights
            - type: state-icon
              style:
                left: 52%
                top: 47%
              entity: light.hallway_ceiling
              tap_action:
                action: toggle
            - type: state-icon
              style:
                left: 35%
                top: 27%
              entity: light.bedroom
              tap_action:
                action: toggle
            - type: state-icon
              style:
                left: 70%
                top: 27%
              entity: light.kidsroom_ceil
              tap_action:
                action: toggle
            - type: state-icon
              style:
                left: 52%
                top: 20%
              entity: light.bathroom_lights
              tap_action:
                action: toggle

        attributes:
          icon: mdi:home-floor-b
      - card:
          type: picture-elements
          card_mod: null
          style: |
            ha-card {height: min-content!important;}
          image: /local/images/plan/22RGRWo2.png
          elements:
            - entity: camera.front_door
              style:
                left: 22%
                top: 77%
                color: "#555fff"
                transform: rotate(180deg)
              type: icon
              icon: mdi:video
            - entity: light.outdoor_light
              style:
                left: 92%
                top: 64%
                margin: 0px
                padding: 10px
                width: 7%
                tag: bathroom
              tap_action:
                action: toggle
              image: /local/images/light_bulb_off.png
              state_image:
                "on": /local/images/light_bulb_on.png
              type: image
        attributes:
          icon: mdi:home

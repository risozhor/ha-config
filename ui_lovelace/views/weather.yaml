          - type: custom:mushroom-template-card # moon_phase_image
            class: col-12 col-md-6 col-lg-3 px-2 pt-4
            primary: "Moon Phase"
            secondary: "{{states.sensor.moon_phase_image.state}}"
            # icon: mdi:raspberry-pi
            entity: sensor.moon_phase_image
            tap_action:
              action: more-info
            multiline_secondary: false
            picture: '{{- state_attr(config.entity, "entity_picture")  }}'
            features_position: bottom
            card_mod:
              style: >
                {% set rgb = '#00ffff' %} ha-tile-icon:before {
                  content: '';
                  position: absolute;
                  inset: 0;
                  border-radius: inherit;
                  pointer-events: none;
                  transform-origin: 50% 50%;

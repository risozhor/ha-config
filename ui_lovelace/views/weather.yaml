          - type: custom:mushroom-entity-card # lethbridge_aqi
            class: col-12 col-md-6 col-lg-3 px-2 pt-4
            entity: sensor.lethbridge_aqi
            tap_action:
              action: more-info
            primary: "{{state_attr(config.entity, 'friendly_name') | capitalize }}"
            icon: mdi:air-filter
            primary_info: state
            secondary_info: name
            icon_color: light-grey
            card_mod:
              style: |
                ha-card {
                  {% set state = states(config.entity) %}
                  {% set pollution_level = states('sensor.air_pollution_level') %}
                  {% if pollution_level in ['high', 'very-high', 'red','unhealthy','very_unhealthy','hazardous'] %}
                    {% set c1 = '255, 0, 0' %}  /* Red RGB */
                    {% set c2 = '255, 69, 0' %}   /* Orange RGB */
                    {% set speed = '3s' %}
                  {% elif pollution_level in ['moderate', 'medium', 'orange','unhealthy_sensitive'] %}
                    {% set c1 = '255, 69, 0' %}  /* Orange RGB */
                    {% set c2 = '255, 255, 0' %}   /* Yellow RGB */
                    {% set speed = '8s' %}
                  {% else %}
                    {% set c1 = '0, 242, 96' %}    /* Green RGB */
                    {% set c2 = '5, 117, 230' %}   /* Blue RGB */
                    {% set speed = '10s' %}
                  {% endif %}
                  --aura-color-1: rgba({{ c1 }}, 0.6);
                  --aura-color-2: rgba({{ c2 }}, 0.6);
                  --speed: {{ speed }};
                  background: #382323ff !important;
                  border-radius: 4px;
                  border: 1px solid rgba(255,255,255,0.08);
                  position: relative;
                  overflow: hidden;
                  box-shadow: inset 0 0 20px rgba(116, 74, 74, 0.5);
                }
                ha-card::before {
                  content: "";
                  position: absolute;
                  top: -50%; left: -50%;
                  width: 200%; height: 200%;
                  z-index: 0;
                  background-image: 
                    radial-gradient(circle at 50% 50%, var(--aura-color-1) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, var(--aura-color-2) 0%, transparent 50%);
                  filter: blur(60px);
                  opacity: 0.8;
                  animation: rotate-aura var(--speed) linear infinite;
                }
                ha-card::after {
                  content: '{{ pollution_level | replace("_", " ") |capitalize }}';
                  position: absolute;
                  top: 50%; 
                  right: 16px;
                  transform: translateY(-50%);
                  z-index: 10;
                  /* Badge Styling (Like the battery example) */
                  color: white;
                  font-weight: 700;
                  font-size: 14px;
                  background: rgba(93, 45, 45, 0.4);
                  border: 1px solid rgba(255, 255, 255, 0.15);
                  backdrop-filter: blur(4px);
                  padding: 4px 10px;
                  border-radius: 4px;
                  text-shadow: 0 1px 2px black;
                }
                ha-card {
                  clip-path: inset(0 0 0 0 round var(--ha-card-border-radius, 4px));
                  --card-primary-font-size: 1.2rem !important;
                  --card-primary-line-height: 1.3 !important;
                }
                .mushroom-state-info span.primary {
                  color: white !important;
                  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
                }
                .mushroom-state-info span.secondary {
                  color: rgba(255,255,255,0.8) !important;
                }
                ha-state-icon {color: white !important;}
                @keyframes rotate-aura {
                  0% { transform: rotate(0deg); }
                  100% { transform: rotate(360deg); }
                }


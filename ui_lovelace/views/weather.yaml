          - type: custom:mushroom-template-card # aurora_visibility_visibility
            class: col-12 col-md-6 col-lg-3 px-2 pt-4

            primary: "{{states.sensor.aurora_visibility_visibility.state}}%"
            secondary: Aurora Visibility
            entity: sensor.aurora_visibility_visibility
            tap_action:
              action: more-info
            multiline_secondary: false
            picture: local/custom_local_icons/aurora.svg
            features_position: bottom
            card_mod:
              style: |
                /* 1. Get the alert Sensor Data */
                  {% set state = states(config.entity)| replace('%','')| int() %}
                  {% set alert = states('binary_sensor.aurora_visibility_visibility_alert') %}
                  {% if alert == 'on' %}
                  {% set txt = 'Visibility Alert' %}  
                  {% else %}
                  {% set txt = 'Low chance' %}   
                  {% endif %}
                  {% set rgb = '#00ffff' %}
                  {% if state >= 50 %}
                    {% set c1 = '255, 65, 108' %}  /* Red RGB */
                    {% set c2 = '255, 75, 43' %}   /* Orange RGB */
                    {% set speed = '4s' %}
                  {% elif state >=20 %}
                    {% set c1 = '247, 151, 30' %}  /* Orange RGB */
                    {% set c2 = '255, 210, 0' %}   /* Yellow RGB */
                    {% set speed = '7s' %}
                  {% else %}
                    {% set c1 = '0, 242, 96' %}    /* Green RGB */
                    {% set c2 = '5, 117, 230' %}   /* Blue RGB */
                    {% set speed = '12s' %}
                  {% endif %}
                ha-tile-icon:before {
                  content: '';
                  position: absolute;
                  inset: 0;
                  border-radius: inherit;
                  pointer-events: none;
                  transform-origin: 50% 50%;
                  opacity:1;
                  }
                ha-tile-icon {
                  padding:0!important;
                  margin: 0!important;
                  position: relative;
                  border-radius: 50%;
                }  ha-card {
                  clip-path: inset(0 0 0 0 round var(--ha-card-border-radius,12px));
                  /* 3. Pass variables to CSS */
                  --aura-color-1: rgba({{ c1 }}, 1);
                  --aura-color-2: rgba({{ c2 }}, 1);
                  --speed: {{ speed }};
                  background: #00000000 !important;
                  position: relative;
                  overflow: hidden;
                }  ha-card::before {
                  content: "";
                  position: absolute;
                  top: 0; left: 0; bottom: 0;
                  z-index: -1;
                  width: 100%;
                  background-size: 100% 100%;
                background-image: 
                    radial-gradient(circle at 50% 50%, var(--aura-color-1) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, var(--aura-color-2) 0%, transparent 50%);
                  filter: blur(60px);
                  opacity: 0.9;
                  animation: rotate-aura var(--speed) linear infinite;
                }  }  ha-card::before {
                  top: -50%; left: -50%;
                  height: 200%;
                  filter: blur(60px);
                  opacity: 0.8;
                  animation: rotate-aura 2s linear infinite;
                }  ha-card::after {
                  content: '{{ txt }}';
                  position: absolute;
                  top: 50%; 
                  right: 16px;
                  transform: translateY(-50%);
                  z-index: 10;
                  color: white;
                  font-weight: 700;
                  font-size: 14px;
                  background: rgba(0, 0, 0, 0.7);
                  border: 1px solid rgba(255, 255, 255, 0.15);
                  backdrop-filter: blur(4px);
                  padding: 4px 10px;
                  border-radius: 6px;
                  text-shadow: 0 1px 2px black;
                } /* Animation */
                  @keyframes rotate-aura {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                  }

          - type: custom:vertical-stack-in-card #sunset
            card_mod:
              style:
                .: |
                  ha-card {
                      overflow: hidden !important;
                      }
            class: col-12 col-md-6 col-lg-3 px-2 pt-4

                  }
                ha-tile-icon {
                  padding:0!important;
                  margin: 0!important;
                  position: relative;
                  background: var(--card-background-color);
                  border-radius: 50%;
                  animation: robo-path 4s linear infinite;
                }   ha-card {clip-path: inset(0 0 0 0 round
                var(--ha-card-border-radius,12px));} ha-card::before {
                  content: "";
                  position: absolute;
                  top: 0; left: 0; bottom: 0;
                  z-index: -1;
                  width: 100%;
                  background: linear-gradient(90deg,rgba(0, 0, 0, 0) 0%, {{ rgb }} 100%);
                  animation: AnimationName 3s ease infinite;
                  background-size: 200% 500%;
                  transition: width 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
                } @keyframes robo-path {
                  0%   { transform: rotate(0deg);}

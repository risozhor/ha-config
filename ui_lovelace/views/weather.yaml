                    mushroom-shape-icon$: |
                      .shape {
                        {% set rgb = '110,140,55' %}
                        --shape-animation: breathe 3s ease-in-out infinite;
                        opacity: 1;
                        --icon-color: rgba({{ rgb }}, 1);
                        background-color: rgba(77, 00, 77,0.1) !important;

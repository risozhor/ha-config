                          bottom: -10px;
                          right: -10px;
                          }
              - type: custom:mushroom-template-card
                class: col-12 col-md-6 col-lg-3 px-2 pt-4
                primary: >-
                  {% if is_state("sun.sun", "above_horizon") -%} The sun rose {{
                  relative_time(states.sun.sun.last_changed) }} ago {%- else -%}The sun will
                  rise in {% set t = (state_attr('sun.sun', 'next_rising') | as_datetime -
                  now()).total_seconds() %}{{ t | timestamp_custom('%-H hr %-M min' if t >
                  3600 else '%-M min', false) }} {%- endif %}
                secondary: >-
                  Sunset at:
                  {{as_timestamp(states.sensor.astroweather_backyard_sun_next_setting.state)
                  | timestamp_custom('%H:%M') }} / Sunrise at:
                  {{as_timestamp(states.sensor.astroweather_backyard_sun_next_rising.state)
                  | timestamp_custom('%H:%M') }}
                entity: sensor.wind_direction
                tap_action:
                  action: more-info
                  entity: sun.sun
                multiline_secondary: false

                        mushroom-shape-icon$: |
                          .shape {
                            {% set state_entity    = 'light.hallway_ceiling1' %}
                            {% set active_value    = 'on' %}
                              {% set trigger_active = (states(state_entity) == active_value) %}
                            {% set rgb = state_attr(config.entity, 'rgb_color') %}
                            {% if rgb is not none %}
                              {% set r = (rgb[0] | int) %}
                              {% set g = (rgb[1] | int) %}
                              {% set b = (rgb[2] | int) %}

          - type: col # storage
            class: col-12 col-md-4 col-lg-3
            cards:
              - type: row
                cards:
                  - type: markdown
                    class: col
                    card_mod:
                      style: |
                        ha-card {border: none;}
                        ha-markdown {
                          padding: 16px 0px 16px!important;
                          overflow-wrap: normal!important;
                        }
                    content: >-
                      ## Storage
              - type: row
                cards:
                  - type: custom:mushroom-light-card
                    class: col-12
                    entity: light.storage_ceiling
                    name: Storage Lamp
                    use_light_color: true
                    show_color_temp_control: true
                    show_brightness_control: true
                    collapsible_controls: false
                    show_color_control: true
                    icon_color: auto
                    card_mod:
                      style:
                        mushroom-shape-icon$: |
                          .shape {
                            {% set state_entity    = 'light.storage_ceiling' %}
                            {% set active_value    = 'on' %}
                              {% set trigger_active = (states(state_entity) == active_value) %}
                            {% set rgb = state_attr(config.entity, 'rgb_color') %}
                            {% if rgb is not none %}
                              {% set r = (rgb[0] | int) %}
                              {% set g = (rgb[1] | int) %}
                              {% set b = (rgb[2] | int) %}
                            {% else %}
                              {# fallback for CT-only lights #}
                              {% set r = 255 %}
                              {% set g = 240 %}
                              {% set b = 200 %}
                            {% endif %}
                            {% if trigger_active %}
                              --shape-animation: lamp-sweep 1.8s ease-in-out infinite;
                              opacity: 1;
                            {% else %}
                              --shape-animation: none;
                              opacity: 0.5;
                            {% endif %}
                            position: relative;
                            transform-origin: 50% 60%;
                          }
                          @keyframes lamp-sweep {
                            0% {
                              filter: brightness(1.1);
                              box-shadow:
                                0 0 12px 4px rgba({{ r }}, {{ g }}, {{ b }}, 0.9),
                                0 30px 40px -10px rgba({{ r }}, {{ g }}, {{ b }}, 0.0);
                              transform: rotate(-4deg) scale(1);
                            }
                            25% {
                              filter: brightness(1.4);
                              box-shadow:
                                0 0 18px 8px rgba({{ r }}, {{ g }}, {{ b }}, 1),
                                -8px 35px 45px -12px rgba({{ r }}, {{ g }}, {{ b }}, 0.5);
                              transform: rotate(3deg) scale(1.02);
                            }
                            50% {
                              filter: brightness(1.2);
                              box-shadow:
                                0 0 24px 10px rgba({{ r }}, {{ g }}, {{ b }}, 0.9),
                                8px 35px 45px -12px rgba({{ r }}, {{ g }}, {{ b }}, 0.5);
                              transform: rotate(-2deg) scale(1.03);
                            }
                            75% {
                              filter: brightness(1.5);
                              box-shadow:
                                0 0 18px 8px rgba({{ r }}, {{ g }}, {{ b }}, 1),
                                -6px 30px 40px -12px rgba({{ r }}, {{ g }}, {{ b }}, 0.4);
                              transform: rotate(2deg) scale(1.01);
                            }
                            100% {
                              filter: brightness(1.1);
                              box-shadow:
                                0 0 12px 4px rgba({{ r }}, {{ g }}, {{ b }}, 0.8),
                                0 30px 40px -10px rgba({{ r }}, {{ g }}, {{ b }}, 0.0);
                              transform: rotate(-4deg) scale(1);
                            }
                          }
                        .: |
                          ha-card {
                            clip-path: inset(0 0 0 0 round var(--ha-card-border-radius, 12px));
                          }
          - type: col # laundry
            class: col-12 col-md-4 col-lg-3
            cards:
              - type: row
                cards:
                  - type: markdown
                    class: col
                    card_mod:
                      style: |
                        ha-card {border: none;}
                        ha-markdown {
                          padding: 16px 0px 16px!important;
                          overflow-wrap: normal!important;
                        }
                    content: >-
                      ## Laundry
              - type: row
                cards:
                  - class: col-12
                    type: custom:mushroom-entity-card
                    entity: light.laundry_switch
                    tap_action:
                      action: toggle
                    icon: hue:room-laundry
                    primary_info: name
                    secondary_info: none
                    card_mod:
                      style: |
                        ha-card {
                          {% set state = states(config.entity) %}
                          {% set motionstate = states('timer.laundry_light_manual_timer') %}
                          {% set motion_timer = states('timer.laundry_light_on_by_motion_timer') %}
                          {% if state in ['off'] %}
                            {% set c1 = '0, 40, 255' %} 
                            {% set c2 = '100, 100, 20' %}
                            {% set opacity = '0.3' %}
                            {% set speed = '9s' %}
                            {% set motionstate ='Off' %}
                          {% elif motion_timer in ['active'] %}
                            {% set c1 = '255, 69, 0' %}  /* Orange RGB */
                            {% set c2 = '255, 255, 0' %}   /* Yellow RGB */
                            {% set opacity = '0.6' %}
                            {% set speed = '3s' %}
                            {% set motionstate ='On By Motion' %}
                          {% else %}
                            {% set c1 = '0, 242, 96' %}    /* Green RGB  */
                            {% set c2 = '5, 117, 230' %}   /* Blue RGB */
                            {% set opacity = '0.6' %}
                            {% set speed = '5s' %}
                            {% set motionstate ='On' %}
                          {% endif %}
                          --aura-color-1: rgba({{ c1 }}, {{ opacity }});
                          --aura-color-2: rgba({{ c2 }}, {{ opacity }});
                          --speed: {{ speed }};
                          border-radius: 4px;
                          border: 1px solid rgba(255,255,255,0.08);
                          position: relative;
                          overflow: hidden;
                          
                        }
                        ha-card::before {
                          content: "";
                          position: absolute;
                          top: -50%; left: -50%;
                          width: 200%; height: 200%;
                          z-index: 0;
                          background-image: 
                            radial-gradient(circle at 50% 50%, var(--aura-color-1) 0%, transparent 50%),
                            radial-gradient(circle at 80% 80%, var(--aura-color-2) 0%, transparent 50%);
                          filter: blur(60px);
                          opacity: 0.8;
                          animation: rotate-aura var(--speed) linear infinite;
                        }
                        ha-card::after {
                          content: '{{ motionstate | replace("_", " ") |capitalize }}';
                          position: absolute;
                          top: 50%; 
                          right: 16px;
                          transform: translateY(-50%);
                          z-index: 10;
                          /* Badge Styling (Like the battery example) */
                          color: white;
                          font-weight: 700;
                          font-size: 14px;
                          background: rgba(93, 45, 45, 0.4);
                          border: 1px solid rgba(255, 255, 255, 0.15);
                          backdrop-filter: blur(4px);
                          padding: 4px 10px;
                          border-radius: 4px;
                          text-shadow: 0 1px 2px black;
                        }
                        ha-card {
                          clip-path: inset(0 0 0 0 round var(--ha-card-border-radius, 4px));
                          --card-primary-font-size: 1.2rem !important;
                          --card-primary-line-height: 1.3 !important;
                        }
                        .mushroom-state-info span.primary {
                          color: white !important;
                          text-shadow: 0 2px 4px rgba(0,0,0,0.5);
                        }
                        .mushroom-state-info span.secondary {
                          color: rgba(255,255,255,0.8) !important;
                        }
                        ha-state-icon {color: white !important;}
                        @keyframes rotate-aura {
                          0% { transform: rotate(0deg); }
                          100% { transform: rotate(360deg); }
                        }

                          action: light.turn_off
                          target:
                            entity_id: light.wled
                          data:
                            transition: 1
                        card_mod:
                          style: |
                            ha-card {
                              {% set pos_y = 'top' %}               
                              {% set pos_y_val = '0' %}
                              {% set pos_x = 'right' %}             
                              {% set pos_x_val = '0%' %}
                              {% set icon_size = '25px' %}          
                              {% set badge_height = '7px' %}            
                              {% set border_thickness = '0.5px' %}
                              {% set active_border = '#777' %}
                              {% set active_opacity = 0.3 %}
                              --chip-padding: {{ badge_height }};
                              --chip-border-radius: 10px;
                              --chip-box-shadow: 0 0 0 {{ border_thickness }} {{ active_border }} !important;
                              --color: white !important; 
                              --chip-icon-size: {{ icon_size }} !important; 
                              --mdc-icon-size: {{ icon_size }} !important;   
                              --chip-height: auto !important;
                              top: {{ pos_y_val }};
                              padding: 5px !important;
                              float: inline-end;
                              animation: none !important;
                              transition: none!important; 
                            }
                      - type: custom:mushroom-chips-card
                        chips:
                          - type: template
                            entity: select.wled_preset
                            icon: mdi:skip-forward
                            tap_action:
                              action: perform-action
                              perform_action: rest_command.next_wled_preset
                              target: {}
                        alignment: end
                        card_mod:
                          style: |
                            ha-card {
                              {% set pos_y_val = '0px' %}  
                              {% set pos_x_val = '10%' %}
                              {% set icon_size = '25px' %}          
                              {% set text_size = '12px' %}          
                              {% set badge_height = '7px' %}       
                              {% set border_radius = '10px' %}      
                              {% set border_thickness = '0.5px' %}
                              {% set active_bg = '#5096ff' %} 
                              {% set active_icon = 'white' %}
                              {% set active_text = 'white' %}
                              {% set active_border = 'white' %}
                              {% set active_opacity = 0.3 %}
                              {% set current_bg = '#5096ff' %}
                              {% set current_icon = 'white' %}
                              {% set current_border = 'white' %}
                              {% set current_op = 0.3 %}
                              --chip-box-shadow: 0 0 0 {{ border_thickness }} {{ active_border }} !important;
                              --chip-icon-size: {{ icon_size }} !important; 
                              --mdc-icon-size: {{ icon_size }} !important; 
